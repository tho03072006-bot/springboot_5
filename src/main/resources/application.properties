# ===== Cau hinh chung =====
# Chay o port khac 8080 de khong dung do voi cac project Servlet/JSP khac (bt2-servlet-jsp, Baitap02)
# dang chay tren Tomcat rieng cua Eclipse/STS
server.port=8081

# ===== Cau hinh Thymeleaf =====
# Tat cache de moi lan sua file .html co the F5 xem ngay, khong can restart server
spring.thymeleaf.cache=false

# ===== Cau hinh ket noi SQL Server =====
# Dung chung server/database "webst2" (localhost,1433) da cau hinh o cac project khac
# cua mon hoc, nhung entity Category o day map sang bang RIENG "tl_category"
# (xem database/tl_category.sql) de khong dung cham du lieu cac bai tap khac.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=webst2;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
# Luu y: khong nen commit mat khau that len GitHub (repo public) - neu can push
# len GitHub, hay chuyen sang bien moi truong (vd spring.datasource.password=${DB_PASSWORD})
# thay vi ghi thang gia tri o day.
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Nang cap cot VARCHAR cua ban cu truoc khi Hibernate doc du lieu Unicode.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# ===== Cau hinh Hibernate/JPA =====
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# update: Hibernate se co gang tu tao/cap nhat bang theo Entity luc chay lan dau.
# Neu khong tu tao duoc bang (tung gap truong hop nay o cac project khac), hay
# tu chay tay file database/tl_category.sql trong SSMS.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
